services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: matura
      POSTGRES_USER: matura
      POSTGRES_PASSWORD: matura
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matura -d matura"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - matura_postgres_data:/var/lib/postgresql/data

volumes:
  matura_postgres_data:
